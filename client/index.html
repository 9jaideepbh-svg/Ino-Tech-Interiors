    <!-- Critical inline CSS: prevent FOUC + reserve hero space + GPU layers -->
    <style>
      /* Critical: body/html defaults to avoid layout shift */
      *, *::before, *::after { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: #1a0a05; font-family: 'Lato', sans-serif; -webkit-font-smoothing: antialiased; }

      /* Reserve hero height immediately — prevents layout shift */
      #hero-section {
        position: relative;
        height: 100dvh;
        min-height: 550px;
        background: #1a0a05; /* dark fallback while video loads */
        overflow: hidden;
        display: flex;
        align-items: center;
      }

      /* Critical video styles — GPU-composited, no jank */
      #hero-video {
        position: absolute;
        top: 50%; left: 50%;
        min-width: 100%; min-height: 100%;
        transform: translate(-50%, -50%) translateZ(0);
        -webkit-transform: translate(-50%, -50%) translateZ(0);
        object-fit: cover;
        object-position: center;
        will-change: transform;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        /* Prevent CPU-to-GPU texture re-upload on every frame */
        -webkit-transform-style: preserve-3d;
        transform-style: preserve-3d;
      }

      /* Force hardware decoding on mobile */
      @media (max-width: 768px) {
        #hero-video {
          /* On mobile, restrict to viewport to avoid oversized decode */
          min-width: 100vw;
          min-height: 100vh;
        }
      }
    </style>

    <!-- Inline script: trigger video play as early as possible for best LCP -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var v = document.getElementById('hero-video');
        if (v) {
          v.muted = true;
          v.play().catch(function() {
            document.addEventListener('touchstart', function t() {
              v.play().catch(function(){});
              document.removeEventListener('touchstart', t);
            }, { once: true, passive: true });
          });
        }
      });
    </script>
